name: moover_driver
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/moover-logo.png
    - assets/brand/moover-logo-reverse.png
    - assets/brand/moover-mark.png
    # PLACEHOLDER Landing (2026-10-10), Unsplash License, ganti dengan foto
    # milik perusahaan. ID foto di nama file: unsplash.com/photos/<id>.
    # 1 Ahmed Nishaath, 2 Janosch Jost, 3 Ed Wingate.
    - assets/images/welcome/
    # PLACEHOLDER tab Trip (2026-10-10): foto kendaraan dari HTML V2.1
    # (docs/), sumber dan lisensi asli tidak diketahui. Ganti dengan foto
    # armada milik perusahaan.
    - assets/images/vehicles/
    - assets/fonts/OFL.txt
  # Plus Jakarta Sans 2.7.1 (tokotype), SIL OFL 1.1 — lihat assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
